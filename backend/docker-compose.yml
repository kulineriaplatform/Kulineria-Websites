version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: kuliner_nusantara_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_kuliner_nusantara
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "8889:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - kuliner_network

volumes:
  db_data:

networks:
  kuliner_network:
    driver: bridge